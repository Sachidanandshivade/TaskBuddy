name: Deploy TaskBuddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TaskBuddy/package-lock.json

      - name: Install dependencies
        working-directory: ./TaskBuddy
        run: npm ci

      - name: Build React application
        working-directory: ./TaskBuddy
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./TaskBuddy/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5